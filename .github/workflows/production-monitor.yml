name: Production health and freshness

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  monitor:
    if: ${{ vars.PRODUCTION_API_BASE != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e ./pipeline
      - run: python -m thermal_drought.monitor "${{ vars.PRODUCTION_API_BASE }}" --maximum-freshness-days 120
